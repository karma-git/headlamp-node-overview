# Example values for the official Headlamp Helm chart (not verified against a live cluster:
# check key names against your chart version).
config:
  pluginsDir: /headlamp/plugins

initContainers:
  - name: node-overview-plugin
    image: <registry>/headlamp-node-overview:0.1.0
    command: ["/bin/sh", "-c", "cp -r /plugins/* /headlamp/plugins/"]
    volumeMounts:
      - name: plugins
        mountPath: /headlamp/plugins

volumes:
  - name: plugins
    emptyDir: {}

volumeMounts:
  - name: plugins
    mountPath: /headlamp/plugins
